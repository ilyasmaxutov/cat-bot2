name: Build Gemini Archive APK
on:
  push:
    branches: [gemini-capture-apk]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Extract source
        run: |
          base64 -d gemini-archive-source.b64 | tar -xz
          sed -i "s/compileSdk 35/compileSdk 37/" app/build.gradle
          sed -i "s/version '8.9.2'/version '9.1.0'/" build.gradle
          echo 'android.suppressUnsupportedCompileSdk=37' >> gradle.properties
          sdkmanager 'platforms;android-37' 'build-tools;37.0.0'
      - name: Compile APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: gemini-archive-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
